[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
servo = "0.8.0"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
url = "2"
serde_json = "1"
webrender_api = "0.70"
dpi = "0.1"
surfman = "0.14.0"
gleam = "0.15"
euclid = "0.22"
glow = "0.17"
adblock = "0.13"
ureq = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading"] }
