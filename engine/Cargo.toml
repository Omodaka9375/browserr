[package]
name = "engine"
version = "0.6.1"
edition = "2024"

[dependencies]
# Thin agent build: servo's default pulls in devtools (Firefox-protocol actor
# server) and multiprocess (compiled out on Windows anyway). Media already
# uses the dummy backend on Windows (no gstreamer). js_jit stays on for page
# JS speed, bundled stays on for the baked-in UA stylesheets.
# SPA/JS compatibility additions (v0.5): webgl bindings (three.js, charts,
# map fallbacks; needs a GL context, software GL works), clipboard (arboard,
# small) and brotli-compression-stream (DecompressionStream; the brotli
# decoder is already in the tree for the network stack). subtlecrypto is
# NOT enableable: its dep chain (servo-script-webcrypto -> rsa 0.10.0-rc.19
# -> pkcs1 0.8.0-rc.5 -> der ^0.8.2) pins a der release that was never
# published to crates.io, so resolution fails. crypto.subtle.digest is
# covered by a JS shim instead (engine/src/main.rs CRYPTO_SHIM_JS).
# no-wgl is WINDOWS-ONLY (below): it enables mozangle/egl, whose build
# script panics on non-Windows targets, so it must never enter the
# Linux/macOS graphs. Resolver v2/v3 (edition 2024) keeps target-specific
# features isolated instead of unioning them.
servo = { version = "0.8.0", default-features = false, features = ["bundled", "js_jit", "webgl", "clipboard", "brotli-compression-stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
rustls-pki-types = "1"
url = "2"
serde_json = "1"
http = "1"
keyboard-types = "0.8"
webrender_api = "0.70"
winit = "0.30.13"
dpi = "0.1"
surfman = "0.14.0"
gleam = "0.15"
euclid = "0.22"
glow = "0.17"
adblock = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "bmp", "webp", "gif"] }

[target.'cfg(windows)'.build-dependencies]
# Windows-only: embeds browserr.ico as the exe icon (see build.rs). Must not
# enter the non-Windows graphs (same rule as the no-wgl servo feature).
winresource = "0.1"

# Size-focused release profile. LTO + single codegen unit let the linker drop
# unreferenced code across servo's ~600 crates. Symbols are stripped where the
# MSVC toolchain allows. panic stays "unwind": close_tab catches the known
# surfman drop panic, and abort would turn that into a hard crash.
[target.'cfg(windows)'.dependencies]
# Windows GL via ANGLE/EGL on D3D11 instead of raw WGL. Without it the
# webgl feature panics the WebGL thread in software-default mode (surfman
# wgl backend cannot create a context), and the panic KILLS THE PAGE's
# script thread on channel disconnect - a page merely probing for webgl
# would break every other script on the page. ANGLE needs no GPU: it
# speaks D3D11, which GPU-less Windows CI and containers provide.
# At runtime servo loads libEGL.dll + libGLESv2.dll BY NAME, so they must
# sit next to engine.exe: engine/build.rs stages them, the engine also
# self-stages on first boot (ensure_angle_dlls in main.rs), and the
# packaging scripts ship them in the archive.
servo = { version = "0.8.0", default-features = false, features = ["no-wgl"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
