name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            gpuless: "1"
          - os: ubuntu-latest
            platform: linux-x64
            gpuless: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate (fmt + clippy + build + test suite)
        shell: pwsh
        env:
          CI_GPULESS: ${{ matrix.gpuless }}
        run: powershell -File scripts/ci.ps1
        if: runner.os == 'Windows'

      - name: Gate (fmt + clippy + build + test suite, linux)
        shell: bash
        run: bash scripts/ci.sh
        if: runner.os == 'Linux'

      - name: Package release zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: powershell -File scripts/package.ps1
        if: runner.os == 'Windows'

      - name: Package release zip (linux)
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/package.sh
        if: runner.os == 'Linux'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            browserr-*-windows-x64.zip
            browserr-*-linux-x64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false