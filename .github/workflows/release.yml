name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022, NOT windows-latest: the latest image's MSVC 14.52
          # STL hard-requires Clang 22+ (STL1000) and kills the C++ build
          # scripts (mozangle). 2022's MSVC matches our toolchain clang.
          - os: windows-2022
            platform: windows-x64
            gpuless: "1"
          # ubuntu-24.04, NOT ubuntu-latest: mozangle's bindgen (webgl
          # feature) chokes on LLVM 21 intrin headers on ubuntu-latest;
          # 24.04 ships LLVM 18 which parses clean (arm64 leg proves it).
          - os: ubuntu-24.04
            platform: linux-x64
            gpuless: ""
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            gpuless: ""
          - os: macos-latest
            platform: macos-arm64
            gpuless: ""
          # Android (Termux): cross-build on linux-x64 with the NDK; no
          # test suite (host legs cover the python side; the engine gets
          # a device test before 0.9.0 ships).
          - os: ubuntu-24.04
            platform: android-arm64
            gpuless: ""
    runs-on: ${{ matrix.os }}
    # ARM64 runners are slower (Servo debug build + tests + release build
    # in one job), so the cap is higher than the fast legs need.
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libxkbcommon-x11-dev: winit's X11 backend (engine --headed)
          # dlopens libxkbcommon-x11 at startup and panics without it.
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            xvfb

      # Android leg: cross-build only (no test suite - Android needs a
      # device/emulator; the same tests run on the three host legs).
      - name: Install NDK r30 (android leg)
        if: matrix.platform == 'android-arm64'
        run: |
          curl -fsSL -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          sudo unzip -q /tmp/ndk.zip -d /opt
          sudo mv /opt/android-ndk-r30 /opt/ndk
          echo "ANDROID_NDK_HOME=/opt/ndk" >> "$GITHUB_ENV"

      - name: Package android tarball
        if: matrix.platform == 'android-arm64'
        run: bash scripts/package_android.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        if: matrix.platform != 'android-arm64'

      - name: Install python test deps
        # The full unix gate runs the terminal-client tests, which import
        # numpy and PIL (frame decode/compare); the windows leg runs
        # GPU-less mode and needs neither, but installing everywhere keeps
        # the matrix uniform and future-proof.
        run: python -m pip install --disable-pip-version-check numpy pillow
        if: matrix.platform != 'android-arm64'

      - name: Gate (fmt + clippy + build + test suite, windows)
        shell: pwsh
        env:
          CI_GPULESS: ${{ matrix.gpuless }}
        run: powershell -File scripts/ci.ps1
        if: runner.os == 'Windows'

      - name: Gate (fmt + clippy + build + test suite, unix)
        shell: bash
        run: bash scripts/ci.sh
        if: runner.os != 'Windows' && matrix.platform != 'android-arm64'

      - name: Package release zip (windows)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: powershell -File scripts/package.ps1
        if: runner.os == 'Windows'

      - name: Package release tarball (unix)
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/package.sh
        if: runner.os != 'Windows' && matrix.platform != 'android-arm64'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            browserr-*-windows-x64.zip
            browserr-*-linux-x64.tar.gz
            browserr-*-linux-arm64.tar.gz
            browserr-*-macos-*.tar.gz
            browserr-*-android-arm64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false