name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fmt + clippy + build + python test suite
        shell: pwsh
        env:
          # GitHub windows-latest runners are GPU-less; servo's WGL backend
          # needs WGL_NV_DX_interop + a real D3D11 device, so render tests
          # cannot pass there. GPU-less mode runs fmt + clippy + build +
          # the render-free protocol tests. Run the full 14-test suite on
          # any machine with a GPU (local: powershell -File scripts/ci.ps1).
          CI_GPULESS: "1"
        run: powershell -File scripts/ci.ps1

      - name: Upload test logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Release build smoke (engine; LTO build)
        shell: pwsh
        run: |
          cargo build --release --manifest-path engine/Cargo.toml *> release-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content release-build.log -Tail 8; exit 1 }

      - name: Upload engine.exe (release)
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows-x64
          path: engine/target/release/engine.exe
          if-no-files-found: error
          retention-days: 14