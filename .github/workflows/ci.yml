name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fmt + clippy + build + python test suite
        shell: pwsh
        run: powershell -File scripts/ci.ps1

      - name: Release build smoke (engine; LTO build)
        shell: pwsh
        run: |
          cargo build --release --manifest-path engine/Cargo.toml *> release-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content release-build.log -Tail 8; exit 1 }