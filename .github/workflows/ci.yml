name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            # GitHub windows-latest runners are GPU-less; servo's WGL backend
            # needs WGL_NV_DX_interop + a real D3D11 device, so render tests
            # cannot pass there. GPU-less mode runs fmt + clippy + build +
            # the render-free protocol tests. The full 25-test suite runs on
            # Linux x64/ARM64 (llvmpipe), macOS (real GPU) and local GPU machines.
            gpuless: "1"
          - os: ubuntu-latest
            platform: linux-x64
            gpuless: ""
          # Native ARM64 runner: same full gate, keeps the Raspberry Pi
          # build green and produces the linux-arm64 release binary.
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            gpuless: ""
          - os: macos-latest
            platform: macos-arm64
            gpuless: ""
    runs-on: ${{ matrix.os }}
    # ARM64 runners are ~2-3x slower; fast legs finish far under the cap.
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # macOS needs no system packages: the servo 0.8 thin build compiles
      # with just the Xcode command line tools (probed before the port).
      - name: Install system deps (linux)
        if: runner.os == 'Linux'
        # ubuntu-latest runners intermittently fail DNS for the ubuntu
        # mirrors (other hosts resolve fine), so apt update/install must
        # retry with backoff before we accept the failure.
        run: |
          apt-get() { sudo apt-get -o Acquire::Retries=5 "$@"; }
          run_with_retries() {
            local desc="$1"; shift
            for i in 1 2 3 4; do
              if "$@"; then return 0; fi
              echo "::warning::$desc failed (attempt $i/4); retrying in 20s"
              sleep 20
            done
            echo "::error::$desc failed after 4 attempts"; return 1
          }
          run_with_retries "apt-get update" apt-get update
          run_with_retries "apt-get install" apt-get install -y --fix-missing \
            libxkbcommon-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fmt + clippy + build + python test suite (windows)
        shell: pwsh
        env:
          CI_GPULESS: ${{ matrix.gpuless }}
        run: powershell -File scripts/ci.ps1
        if: runner.os == 'Windows'

      - name: fmt + clippy + build + python test suite (unix)
        shell: bash
        run: bash scripts/ci.sh
        if: runner.os != 'Windows'

      - name: Upload test logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Release build smoke (engine; LTO build, windows)
        shell: pwsh
        run: |
          cargo build --release --manifest-path engine/Cargo.toml *> release-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content release-build.log -Tail 8; exit 1 }
        if: runner.os == 'Windows'

      - name: Release build smoke (engine; LTO build, unix)
        shell: bash
        run: |
          cargo build --release --manifest-path engine/Cargo.toml > release-build.log 2>&1 || {
            tail -8 release-build.log; exit 1
          }
        if: runner.os != 'Windows'

      - name: Upload engine (release)
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: engine/target/release/engine${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14