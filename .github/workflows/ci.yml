name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # GitHub windows-latest runners are GPU-less; servo's WGL backend
            # needs WGL_NV_DX_interop + a real D3D11 device, so render tests
            # cannot pass there. GPU-less mode runs fmt + clippy + build +
            # the render-free protocol tests. The full 14-test suite runs on
            # Linux (llvmpipe) and locally on any GPU machine.
            gpuless: "1"
          - os: ubuntu-latest
            gpuless: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fmt + clippy + build + python test suite
        shell: pwsh
        env:
          CI_GPULESS: ${{ matrix.gpuless }}
        run: powershell -File scripts/ci.ps1
        if: runner.os == 'Windows'

      - name: fmt + clippy + build + python test suite (linux)
        shell: bash
        run: bash scripts/ci.sh
        if: runner.os == 'Linux'

      - name: Upload test logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Release build smoke (engine; LTO build)
        shell: pwsh
        run: |
          cargo build --release --manifest-path engine/Cargo.toml *> release-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content release-build.log -Tail 8; exit 1 }
        if: runner.os == 'Windows'

      - name: Release build smoke (engine; LTO build, linux)
        shell: bash
        run: |
          cargo build --release --manifest-path engine/Cargo.toml > release-build.log 2>&1 || {
            tail -8 release-build.log; exit 1
          }
        if: runner.os == 'Linux'

      - name: Upload engine (release, windows)
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows-x64
          path: engine/target/release/engine.exe
          if-no-files-found: error
          retention-days: 14
        if: runner.os == 'Windows'

      - name: Upload engine (release, linux)
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-x64
          path: engine/target/release/engine
          if-no-files-found: error
          retention-days: 14
        if: runner.os == 'Linux'