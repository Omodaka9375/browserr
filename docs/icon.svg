<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Browserr icon: dark rounded tile, "B" as stacked right-chevrons (fast/tabs), -->
  <!-- azure on navy, matching the landing-page palette. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131826"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea0ff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none"
        stroke="#232a3a" stroke-width="4"/>

  <g filter="url(#glow)" fill="none" stroke="url(#stroke)"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- upper chevron -->
    <path d="M 168 168 L 296 256 L 168 344" stroke-width="72"/>
    <!-- lower chevron, offset down-right like stacked tabs -->
    <path d="M 232 168 L 360 256 L 232 344" stroke-width="72" opacity="0.55"/>
  </g>
</svg>