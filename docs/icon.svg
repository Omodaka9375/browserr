<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Browserr icon: neutral dark tile, "B" as stacked right-chevrons -->
  <!-- (fast/tabs), white + gray monochrome matching the site's ink/paper -->
  <!-- system (same values as the page's dark-mode palette). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none"
        stroke="#333333" stroke-width="4"/>

  <g filter="url(#glow)" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- upper chevron: white -->
    <path d="M 168 168 L 296 256 L 168 344" stroke="#e8e8e6" stroke-width="72"/>
    <!-- lower chevron, offset down-right like stacked tabs: gray -->
    <path d="M 232 168 L 360 256 L 232 344" stroke="#6a6a6a" stroke-width="72"/>
  </g>
</svg>
