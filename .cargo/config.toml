# Android cross-build wiring (NDK r30, unpacked at C:/Temp/android-ndk-r30).
# Only affects --target=aarch64-linux-android / armv7-linux-androideabi builds;
# host builds are untouched.
#
# API level 29 (Android 10): Bionic exposes stdout/stderr symbols only from 23,
# posix_madvise and AHardwareBuffer_* from 26, and mozjs uses fortified fread.
# -landroid: surfman's hardware-buffer path references AHardwareBuffer_*.

[target.aarch64-linux-android]
linker = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android29-clang.cmd"
ar = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = [
  "-C", "link-arg=-landroid",
]

[target.armv7-linux-androideabi]
linker = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi29-clang.cmd"
ar = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
# -latomic: 32-bit ARM outsources some sync/atomic builtins (e.g.
# __sync_val_compare_and_swap_4) to libatomic; the final link fails
# without it.
rustflags = [
  "-C", "link-arg=-landroid",
  # 32-bit ARM: mozjs references the legacy __sync_val_compare_and_swap_4
  # builtin, which NDK r30's compiler-rt does not provide (no libatomic
  # for armv7 either). .cargo/armv7_sync_shim.o defines it (arm asm).
  "-C", "link-arg=D:/Code/2026/Browserr/.cargo/armv7_sync_shim.o",
]

[env]
CC_aarch64_linux_android = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/clang.exe"
CFLAGS_aarch64_linux_android = "--target=aarch64-linux-android29 --sysroot=C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot"
CXX_aarch64_linux_android = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/clang++.exe"
CXXFLAGS_aarch64_linux_android = "--target=aarch64-linux-android29 --sysroot=C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot"
AR_aarch64_linux_android = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
RANLIB_aarch64_linux_android = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ranlib.exe"
CC_armv7_linux_androideabi = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/clang.exe"
CFLAGS_armv7_linux_androideabi = "--target=armv7a-linux-androideabi29 --sysroot=C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot"
CXX_armv7_linux_androideabi = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/clang++.exe"
CXXFLAGS_armv7_linux_androideabi = "--target=armv7a-linux-androideabi29 --sysroot=C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot"
AR_armv7_linux_androideabi = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
RANLIB_armv7_linux_androideabi = "C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ranlib.exe"

# bindgen (mozangle) parses C++ headers via libclang and needs the Android
# target + libc++ include path; it does not learn them from CXX.
BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android = "--target=aarch64-linux-android29 --sysroot=C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot/usr/include/c++/v1"
BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "--target=aarch64-linux-android29 --sysroot=C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot/usr/include/c++/v1"
BINDGEN_EXTRA_CLANG_ARGS_armv7-linux-androideabi = "--target=armv7a-linux-androideabi29 --sysroot=C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot/usr/include/c++/v1"
BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi = "--target=armv7a-linux-androideabi29 --sysroot=C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/Temp/android-ndk-r30/toolchains/llvm/prebuilt/windows-x86_64/sysroot/usr/include/c++/v1"
